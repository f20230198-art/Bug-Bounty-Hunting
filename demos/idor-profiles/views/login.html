<!DOCTYPE html>
<html>
<head>
  <title>ProfileHub — Login</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff; color: #000; max-width: 500px; margin: 60px auto; padding: 0 20px; }
    h1 { border-bottom: 2px solid #000; padding-bottom: 8px; }
    label { display: block; margin: 10px 0 4px; }
    input { width: 100%; padding: 8px; border: 1px solid #000; font-family: monospace; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 20px; background: #000; color: #fff; border: none; cursor: pointer; }
    button:hover { background: #333; }
    .msg { margin-top: 16px; padding: 10px; border: 1px solid #000; }
    .err { background: #fee; }
    .footer { margin-top: 30px; text-align: center; }
    .footer a { color: #000; }
  </style>
</head>
<body>

<h1>ProfileHub</h1>
<p>Log in to manage your profile.</p>

<form id="loginForm">
  <label>Username</label>
  <input id="u" autocomplete="off" />
  <label>Password</label>
  <input id="p" type="password" />
  <button type="submit">Log in</button>
</form>

<div id="msg"></div>

<div class="footer">
  Don't have an account? <a href="/signup">Sign up</a>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const r = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: document.getElementById('u').value,
      password: document.getElementById('p').value
    })
  });
  const data = await r.json();
  const msg = document.getElementById('msg');
  if (r.ok) {
    window.location.href = '/profile';
  } else {
    msg.className = 'msg err';
    msg.textContent = data.error || 'Login failed';
  }
});
</script>

</body>
</html>
