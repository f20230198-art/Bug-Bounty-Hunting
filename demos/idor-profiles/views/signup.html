<!DOCTYPE html>
<html>
<head>
  <title>ProfileHub — Sign Up</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff; color: #000; max-width: 500px; margin: 60px auto; padding: 0 20px; }
    h1 { border-bottom: 2px solid #000; padding-bottom: 8px; }
    label { display: block; margin: 10px 0 4px; }
    input, textarea { width: 100%; padding: 8px; border: 1px solid #000; font-family: monospace; box-sizing: border-box; }
    textarea { min-height: 70px; resize: vertical; }
    button { margin-top: 16px; padding: 10px 20px; background: #000; color: #fff; border: none; cursor: pointer; }
    button:hover { background: #333; }
    .msg { margin-top: 16px; padding: 10px; border: 1px solid #000; }
    .err { background: #fee; }
    .footer { margin-top: 30px; text-align: center; }
    .footer a { color: #000; }
  </style>
</head>
<body>

<h1>ProfileHub — Sign Up</h1>
<p>Create an account.</p>

<form id="signupForm">
  <label>Username</label>
  <input id="u" autocomplete="off" required />
  <label>Password</label>
  <input id="p" type="password" required />
  <label>Bio</label>
  <textarea id="bio" placeholder="Tell us about yourself..."></textarea>
  <label>Email</label>
  <input id="email" type="email" />
  <button type="submit">Create account</button>
</form>

<div id="msg"></div>

<div class="footer">
  Already have an account? <a href="/">Log in</a>
</div>

<script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const r = await fetch('/api/signup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: document.getElementById('u').value,
      password: document.getElementById('p').value,
      bio: document.getElementById('bio').value,
      email: document.getElementById('email').value
    })
  });
  const data = await r.json();
  const msg = document.getElementById('msg');
  if (r.ok) {
    window.location.href = '/profile';
  } else {
    msg.className = 'msg err';
    msg.textContent = data.error || 'Signup failed';
  }
});
</script>

</body>
</html>
